<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AITranslator 설정</title>
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <h1>AITranslator 설정</h1>
      <section>
        <label for="api-key">Anthropic API 키</label>
        <div class="row">
          <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
          <button id="toggle-key" type="button">보기</button>
        </div>
        <label for="model">모델</label>
        <div class="row">
          <select id="model"></select>
          <input
            id="custom-model"
            type="text"
            placeholder="모델 ID (예: claude-haiku-5-5)"
            aria-label="모델 ID"
            autocomplete="off"
            spellcheck="false"
            hidden
          />
        </div>
        <div class="row">
          <button id="test" type="button">연결 테스트</button>
          <button id="save" type="button">저장</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>
      <section>
        <h2>용어집</h2>
        <label for="glossary-keep">번역하지 않을 단어</label>
        <p id="glossary-keep-hint" class="hint">한 줄에 하나씩</p>
        <textarea id="glossary-keep" rows="6" spellcheck="false" aria-describedby="glossary-keep-hint"></textarea>
        <label for="glossary-map">지정 번역어</label>
        <p id="glossary-map-hint" class="hint">한 줄에 하나씩, 원어 = 번역어 (예: agent = 에이전트)</p>
        <textarea id="glossary-map" rows="6" spellcheck="false" aria-describedby="glossary-map-hint"></textarea>
        <div class="row">
          <button id="save-glossary" type="button">용어집 저장</button>
        </div>
        <p id="glossary-status" class="status" aria-live="polite"></p>
      </section>
      <section>
        <h2>자동 번역 사이트</h2>
        <ul id="auto-sites"></ul>
        <p id="auto-sites-empty" hidden>자동 번역 사이트가 없습니다.</p>
      </section>
      <section>
        <h2>저장된 번역</h2>
        <p id="cache-summary"></p>
        <p class="cleanup">
          <label>캐시가 <input id="cleanup-percent" type="number" min="10" max="100" step="1" />% 이상 차면</label>
          <label>최근 <input id="idle-turns" type="number" min="1" max="1000" step="1" />번의 번역에서 쓰이지 않은 번역문을 지웁니다.</label>
        </p>
        <div class="row">
          <button id="clear-cache" type="button">캐시 비우기</button>
        </div>
        <p id="cache-status" aria-live="polite"></p>
      </section>
      <section>
        <h2>사용량</h2>
        <p id="usage"></p>
      </section>
      <p id="shortcut" class="note"></p>
    </main>
  </body>
</html>
