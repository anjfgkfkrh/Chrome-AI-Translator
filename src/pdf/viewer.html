<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>PDF</title>
    <link rel="stylesheet" href="pdf_viewer.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header id="toolbar">
      <div id="start">
        <button id="menu" class="icon" type="button" aria-label="목차 패널" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <span id="title"></span>
      </div>
      <div id="center">
        <label id="page-group"><input id="page-input" inputmode="numeric" aria-label="쪽 번호" /><span id="page-total"></span></label>
        <span class="separator"></span>
        <button id="zoom-out" class="icon" type="button" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
        <input id="zoom-input" aria-label="배율" />
        <button id="zoom-in" class="icon" type="button" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
        <span class="separator"></span>
        <button id="fit" class="icon" type="button" aria-label="페이지 맞춤"><svg viewBox="0 0 24 24"><path d="M19 12h-2v3h-3v2h5v-5zM7 9h3V7H5v5h2V9zm14-6H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/></svg></button>
        <button id="two-page" class="icon" type="button" aria-label="두 쪽 보기"><svg viewBox="0 0 24 24"><path d="M3 5h8v14H3V5zm2 2v10h4V7H5zm8-2h8v14h-8V5zm2 2v10h4V7h-4z"/></svg></button>
        <button id="rotate" class="icon" type="button" aria-label="회전"><svg viewBox="0 0 24 24"><path d="M15.55 5.55L11 1v3.07C7.06 4.56 4 7.92 4 12s3.05 7.44 7 7.93v-2.02c-2.84-.48-5-2.94-5-5.91s2.16-5.43 5-5.91V10l4.55-4.45zM19.93 11c-.17-1.39-.72-2.73-1.62-3.89l-1.42 1.42c.54.75.88 1.6 1.02 2.47h2.02zM13 17.9v2.02c1.39-.17 2.74-.71 3.9-1.61l-1.44-1.44c-.75.54-1.59.89-2.46 1.03zm3.89-2.42l1.42 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.02c-.14.87-.48 1.72-1.02 2.48z"/></svg></button>
      </div>
      <div id="end">
        <span id="status" role="status"></span>
        <button id="toggle" type="button" hidden></button>
        <button id="download" class="icon" type="button" aria-label="다운로드"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
        <button id="print" class="icon" type="button" aria-label="인쇄"><svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg></button>
      </div>
    </header>
    <section id="notice" hidden>
      <p id="notice-text"></p>
      <button id="allow" type="button" hidden>허용</button>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden />
      <a id="open-original" hidden>원본 PDF 열기</a>
    </section>
    <aside id="sidebar" hidden></aside>
    <div id="viewerContainer">
      <div id="viewer" class="pdfViewer"></div>
      <div id="overlays"></div>
    </div>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
