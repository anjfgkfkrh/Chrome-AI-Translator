<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: single-page app</title>
  </head>
  <body>
    <nav><a id="next" href="/spa/next">Next page</a></nav>
    <main id="app">
      <h1>Welcome to the app</h1>
      <p>This is the first screen.</p>
    </main>
    <button id="add" type="button">Add item</button>
    <ul id="items"></ul>
    <script>
      // 페이지 이동 없이 화면을 바꾸는 SPA 흉내 (pushState + DOM 교체)
      document.getElementById("next").addEventListener("click", (event) => {
        event.preventDefault();
        history.pushState({}, "", "/spa/next");
        document.getElementById("app").innerHTML = "<h1>Second screen</h1><p>Loaded without a page reload.</p>";
      });
      document.getElementById("add").addEventListener("click", () => {
        const item = document.createElement("li");
        item.textContent = "New item added by the page";
        document.getElementById("items").append(item);
      });
    </script>
  </body>
</html>
